name: Sign macOS helpers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    name: Sign ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-15
          - rid: osx-x64
            runner: macos-15-intel
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      MACOS_NOTARY_PROFILE: rimcp-notary

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Publish helper
        run: |
          dotnet publish McpProxy/RiMCP.McpProxy.csproj \
            -c Release -r '${{ matrix.rid }}' --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishDir="$RUNNER_TEMP/publish/${{ matrix.rid }}/"

      - name: Import signing credentials
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          : "${APPLE_CERTIFICATE_P12_BASE64:?Set APPLE_CERTIFICATE_P12_BASE64 in repository secrets}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Set APPLE_CERTIFICATE_PASSWORD in repository secrets}"
          : "${APPLE_NOTARY_KEY_P8:?Set APPLE_NOTARY_KEY_P8 in repository secrets}"
          : "${APPLE_NOTARY_KEY_ID:?Set APPLE_NOTARY_KEY_ID in repository secrets}"
          : "${APPLE_NOTARY_ISSUER_ID:?Set APPLE_NOTARY_ISSUER_ID in repository secrets}"
          umask 077
          MACOS_KEYCHAIN_PATH="$RUNNER_TEMP/rimcp-signing.keychain-db"
          echo "MACOS_KEYCHAIN_PATH=$MACOS_KEYCHAIN_PATH" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$RUNNER_TEMP/rimcp-signing.p12"
          printf '%s\n' "$APPLE_NOTARY_KEY_P8" > "$RUNNER_TEMP/rimcp-notary.p8"
          keychain_password=$(openssl rand -base64 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$MACOS_KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$MACOS_KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$MACOS_KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/rimcp-signing.p12" \
            -k "$MACOS_KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$MACOS_KEYCHAIN_PATH" > /dev/null
          identity=$(security find-identity -v -p codesigning "$MACOS_KEYCHAIN_PATH" |
            sed -nE 's/^[[:space:]]*[0-9]+\) ([0-9A-Fa-f]+) "Developer ID Application:.*$/\1/p')
          if [[ ! "$identity" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo 'The P12 must contain exactly one valid Developer ID Application signing identity.' >&2
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials "$MACOS_NOTARY_PROFILE" \
            --key "$RUNNER_TEMP/rimcp-notary.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --keychain "$MACOS_KEYCHAIN_PATH"

      - name: Sign, verify, and notarize
        run: bash scripts/sign-macos-proxy.sh "$RUNNER_TEMP/publish/${{ matrix.rid }}"

      - name: Upload signed helper
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-mcp-proxy-${{ matrix.rid }}-${{ github.sha }}
          path: ${{ runner.temp }}/publish/${{ matrix.rid }}.zip
          if-no-files-found: error
          compression-level: 0

      - name: Remove signing credentials
        if: always()
        run: |
          cleanup_status=0
          if [ -f "$RUNNER_TEMP/rimcp-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/rimcp-signing.keychain-db" || cleanup_status=$?
          fi
          rm -f "$RUNNER_TEMP/rimcp-signing.p12" "$RUNNER_TEMP/rimcp-notary.p8"
          exit "$cleanup_status"
