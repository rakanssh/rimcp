name: Compare proxy candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Compare ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2022
          - rid: linux-x64
            runner: ubuntu-22.04
          - rid: osx-arm64
            runner: macos-15
          - rid: osx-x64
            runner: macos-15-intel
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      MACOS_NOTARY_PROFILE: rimcp-notary

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.2
          cache: false

      - name: Install Linux native compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Build candidates
        run: |
          trial_root=$(python -c 'import os; from pathlib import Path; print(Path(os.environ["RUNNER_TEMP"]).as_posix() + "/comparison")')
          echo "TRIAL_ROOT=$trial_root" >> "$GITHUB_ENV"
          bash experiments/proxy-comparison/build.sh '${{ matrix.rid }}' "$trial_root"
          dotnet --info > "$trial_root/dotnet-info.txt"
          go version > "$trial_root/go-version.txt"

      - name: Import signing credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_CERTIFICATE:?Set APPLE_CERTIFICATE in repository secrets}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Set APPLE_CERTIFICATE_PASSWORD in repository secrets}"
          : "${APPLE_ID:?Set APPLE_ID in repository secrets}"
          : "${APPLE_PASSWORD:?Set APPLE_PASSWORD in repository secrets}"
          : "${APPLE_TEAM_ID:?Set APPLE_TEAM_ID in repository secrets}"
          umask 077
          MACOS_KEYCHAIN_PATH="$RUNNER_TEMP/rimcp-signing.keychain-db"
          echo "MACOS_KEYCHAIN_PATH=$MACOS_KEYCHAIN_PATH" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$RUNNER_TEMP/rimcp-signing.p12"
          keychain_password=$(openssl rand -base64 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$MACOS_KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$MACOS_KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$MACOS_KEYCHAIN_PATH"
          # codesign also needs the temporary keychain in the runner's search list.
          security list-keychains -d user -s "$MACOS_KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/rimcp-signing.p12" \
            -k "$MACOS_KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$MACOS_KEYCHAIN_PATH" > /dev/null
          identity=$(security find-identity -v -p codesigning "$MACOS_KEYCHAIN_PATH" |
            sed -nE 's/^[[:space:]]*[0-9]+\) ([0-9A-Fa-f]+) "Developer ID Application:.*$/\1/p')
          if [[ ! "$identity" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo 'The P12 must contain exactly one valid Developer ID Application signing identity.' >&2
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials "$MACOS_NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --keychain "$MACOS_KEYCHAIN_PATH"

      - name: Sign, verify, and notarize native candidates
        if: runner.os == 'macOS'
        run: |
          bash experiments/proxy-comparison/sign-native.sh "$TRIAL_ROOT/aot/${{ matrix.rid }}"
          bash experiments/proxy-comparison/sign-native.sh "$TRIAL_ROOT/go/${{ matrix.rid }}"

      - name: Test all tools and measure startup
        run: |
          python experiments/proxy-comparison/compare.py --rid '${{ matrix.rid }}' \
            --root "$TRIAL_ROOT" --manifest experiments/proxy-comparison/go/manifest.json

      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proxy-comparison-${{ matrix.rid }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/comparison/*-${{ matrix.rid }}.zip
            ${{ runner.temp }}/comparison/results-*.json
            ${{ runner.temp }}/comparison/*-info.txt
            ${{ runner.temp }}/comparison/go-version.txt
            ${{ runner.temp }}/comparison/*-load-commands.txt
            ${{ runner.temp }}/comparison/*-libraries.txt
            ${{ runner.temp }}/comparison/*/${{ matrix.rid }}/signature.txt
            ${{ runner.temp }}/comparison/*/${{ matrix.rid }}/notarization.json
          if-no-files-found: warn
          compression-level: 0

      - name: Remove signing credentials
        if: always() && runner.os == 'macOS'
        run: |
          cleanup_status=0
          if [ -f "$RUNNER_TEMP/rimcp-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/rimcp-signing.keychain-db" || cleanup_status=$?
          fi
          rm -f "$RUNNER_TEMP/rimcp-signing.p12"
          exit "$cleanup_status"
