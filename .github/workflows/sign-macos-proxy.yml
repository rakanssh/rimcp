name: Build MCP helpers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2022
          - rid: linux-x64
            runner: ubuntu-22.04
          - rid: osx-arm64
            runner: macos-15
          - rid: osx-x64
            runner: macos-15-intel
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      MACOS_NOTARY_PROFILE: rimcp-notary

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Install Linux compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Check Rust
        run: |
          cargo fmt --manifest-path McpProxy/Cargo.toml --check
          cargo clippy --locked --manifest-path McpProxy/Cargo.toml -- -D warnings

      - name: Publish helper
        run: python scripts/publish-mcp-proxy.py --rid '${{ matrix.rid }}' --output-root "$RUNNER_TEMP/publish"

      - name: Import signing credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_CERTIFICATE:?Set APPLE_CERTIFICATE in repository secrets}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Set APPLE_CERTIFICATE_PASSWORD in repository secrets}"
          : "${APPLE_ID:?Set APPLE_ID in repository secrets}"
          : "${APPLE_PASSWORD:?Set APPLE_PASSWORD in repository secrets}"
          : "${APPLE_TEAM_ID:?Set APPLE_TEAM_ID in repository secrets}"
          umask 077
          MACOS_KEYCHAIN_PATH="$RUNNER_TEMP/rimcp-signing.keychain-db"
          echo "MACOS_KEYCHAIN_PATH=$MACOS_KEYCHAIN_PATH" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$RUNNER_TEMP/rimcp-signing.p12"
          keychain_password=$(openssl rand -base64 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$MACOS_KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$MACOS_KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$MACOS_KEYCHAIN_PATH"
          # codesign also needs the temporary keychain in the runner's search list.
          security list-keychains -d user -s "$MACOS_KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/rimcp-signing.p12" \
            -k "$MACOS_KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$MACOS_KEYCHAIN_PATH" > /dev/null
          identity=$(security find-identity -v -p codesigning "$MACOS_KEYCHAIN_PATH" |
            sed -nE 's/^[[:space:]]*[0-9]+\) ([0-9A-Fa-f]+) "Developer ID Application:.*$/\1/p')
          if [[ ! "$identity" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo 'The P12 must contain exactly one valid Developer ID Application signing identity.' >&2
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials "$MACOS_NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --keychain "$MACOS_KEYCHAIN_PATH"

      - name: Sign, verify, and notarize
        if: runner.os == 'macOS'
        run: bash scripts/sign-macos-proxy.sh "$RUNNER_TEMP/publish/${{ matrix.rid }}"

      - name: Package helper
        if: runner.os != 'macOS'
        run: |
          python - "$RUNNER_TEMP/publish/${{ matrix.rid }}" <<'PY'
          from pathlib import Path
          import sys
          import zipfile
          directory = Path(sys.argv[1])
          executable = "RiMCP.McpProxy.exe" if directory.name == "win-x64" else "RiMCP.McpProxy"
          with zipfile.ZipFile(str(directory) + ".zip", "x", zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for name in (executable, "LICENSE.TXT", "THIRD-PARTY-NOTICES.TXT"):
                  archive.write(directory / name, directory.name + "/" + name)
          PY

      - name: Verify all proxy tools and I/O boundaries
        run: |
          dotnet run --project McpProxy/Manifest/Export.csproj --configuration Release -- \
            RiMCP/About/About.xml "$RUNNER_TEMP/manifest.json"
          suffix=''
          if [[ '${{ matrix.rid }}' == win-* ]]; then suffix=.exe; fi
          python .github/proxy-smoke.py \
            --binary "$RUNNER_TEMP/publish/${{ matrix.rid }}/RiMCP.McpProxy$suffix" \
            --manifest "$RUNNER_TEMP/manifest.json" \
            --output "$RUNNER_TEMP/publish/${{ matrix.rid }}-checks.json"

      - name: Upload helper
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-proxy-${{ matrix.rid }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/publish/${{ matrix.rid }}.zip
            ${{ runner.temp }}/publish/${{ matrix.rid }}-checks.json
          if-no-files-found: error
          compression-level: 0

      - name: Remove signing credentials
        if: always() && runner.os == 'macOS'
        run: |
          cleanup_status=0
          if [ -f "$RUNNER_TEMP/rimcp-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/rimcp-signing.keychain-db" || cleanup_status=$?
          fi
          rm -f "$RUNNER_TEMP/rimcp-signing.p12"
          exit "$cleanup_status"
