[package]
name = "rimcp-proxy"
version = "0.5.6"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
